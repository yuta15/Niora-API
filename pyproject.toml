[project]
name = "niora-api"
version = "0.0.1"
description = "Backend API for Niora"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

# This repository is an application, so uv does not need to build/install it as a package.
[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "E4", # pycodestyle imports
    "E7", # pycodestyle statements
    "E9", # pycodestyle runtime errors
    "F",  # Pyflakes
    "I",  # isort
    "UP", # pyupgrade
]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
no_implicit_optional = true
pretty = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]
pythonpath = ["."]
markers = [
    "integration: controlled external servicesを使用するIntegrationテスト",
    "e2e: Niora全体を通して検証するE2Eテスト",
]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true
