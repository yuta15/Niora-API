[project]
name = "niora-api"
version = "0.0.1"
description = "Backend API for Niora"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "httpx2>=2.12.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pymysql>=1.2.0",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "import-linter>=2.8.1",
    "pre-commit>=4.6.1",
    "pyright>=1.1.407",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.1",
]

# This repository is an application, so uv does not need to build/install it as a package.
[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "E4", # pycodestyle imports
    "E7", # pycodestyle statements
    "E9", # pycodestyle runtime errors
    "F",  # Pyflakes
    "I",  # isort
    "UP", # pyupgrade
]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
no_implicit_optional = true
pretty = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.importlinter]
root_package = "src"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Textbook Domain does not depend on outer layers"
type = "forbidden"
source_modules = ["src.textbook.domain"]
forbidden_modules = ["src.textbook.application", "src.textbook.adapter", "src.api", "src.workspace"]

[[tool.importlinter.contracts]]
name = "Workspace Domain does not depend on outer layers"
type = "forbidden"
source_modules = ["src.workspace.domain"]
forbidden_modules = ["src.workspace.application", "src.workspace.adapter", "src.api", "src.textbook"]

[[tool.importlinter.contracts]]
name = "Textbook Application does not depend on delivery or infrastructure"
type = "forbidden"
source_modules = ["src.textbook.application"]
forbidden_modules = ["src.textbook.adapter", "src.api", "src.workspace.domain", "src.workspace.adapter"]

[[tool.importlinter.contracts]]
name = "Textbook module does not depend on Workspace runtime layers"
type = "forbidden"
source_modules = ["src.textbook"]
forbidden_modules = ["src.workspace.domain", "src.workspace.adapter"]

[[tool.importlinter.contracts]]
name = "Workspace module does not depend on Textbook implementation layers"
type = "forbidden"
source_modules = ["src.workspace"]
forbidden_modules = ["src.textbook.domain", "src.textbook.adapter"]

[[tool.importlinter.contracts]]
name = "Workspace Application does not depend on delivery or infrastructure"
type = "forbidden"
source_modules = ["src.workspace.application"]
forbidden_modules = ["src.workspace.adapter", "src.api", "src.textbook.domain", "src.textbook.adapter"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]
pythonpath = ["."]
markers = [
    "integration: controlled external servicesを使用するIntegrationテスト",
    "e2e: Niora全体を通して検証するE2Eテスト",
]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true
