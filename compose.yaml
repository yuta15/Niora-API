services:
  mysql:
    image: mysql:9.7.2
    environment:
      MYSQL_DATABASE: ${NIORA_DATABASE_NAME:?NIORA_DATABASE_NAME must be set}
      MYSQL_USER: ${NIORA_DATABASE_MIGRATION_USER:?NIORA_DATABASE_MIGRATION_USER must be set}
      MYSQL_PASSWORD: ${NIORA_DATABASE_MIGRATION_PASSWORD:?NIORA_DATABASE_MIGRATION_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${NIORA_DATABASE_ADMIN_PASSWORD:?NIORA_DATABASE_ADMIN_PASSWORD must be set}
      NIORA_DATABASE_APPLICATION_USER: ${NIORA_DATABASE_APPLICATION_USER:?NIORA_DATABASE_APPLICATION_USER must be set}
      NIORA_DATABASE_APPLICATION_PASSWORD: ${NIORA_DATABASE_APPLICATION_PASSWORD:?NIORA_DATABASE_APPLICATION_PASSWORD must be set}
    ports:
      - "${NIORA_DATABASE_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 20s
    volumes:
      - mysql-data:/var/lib/mysql
      - ./compose/mysql/init:/docker-entrypoint-initdb.d:ro

volumes:
  mysql-data:
